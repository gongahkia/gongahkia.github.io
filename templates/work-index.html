{% extends "base.html" %}
{% block content %}
<article class="collection-page">
  <h1>Work</h1>
  <p class="lede">Selected projects spanning legal technology, product engineering, and experiments.</p>
  <ul class="collection-list">
    {% for work in works %}
    <li>
      <p><a href="{{ work.href }}">{{ work.title }}</a> <span class="muted">· {{ work.date }}</span></p>
      <p>{{ work.summary }}</p>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
