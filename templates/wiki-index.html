{% extends "base.html" %}
{% set eden_page = true %}
{% block structured_data %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": {{ (canonical_url ~ "#collection")|tojson }},
    "url": {{ canonical_url|tojson }},
    "name": "Gabriel's Personal Wiki",
    "description": {{ meta_description|tojson }},
    "isPartOf": {
      "@type": "WebSite",
      "@id": {{ (root_site_url ~ "#website")|tojson }},
      "url": {{ root_site_url|tojson }},
      "name": "Gabriel Ong"
    },
    "author": {"@type": "Person", "@id": {{ person_id|tojson }}, "name": "Gabriel Ong", "url": {{ root_site_url|tojson }}}
  }
  </script>
{% endblock %}
{% block content %}
<article class="eden-content">
  <h1><a class="wiki-download" href="https://github.com/gongahkia/gongahkia.github.io/releases" title="Download the personal wiki">Personal Wiki</a></h1>
  <ul class="eden-list">
    {% for note in notes %}
    <li><a href="pages/{{ note.filename }}"><span class="eden-list-title">{{ note.title }}</span><span class="eden-meta">{{ note.size }}</span></a></li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
