<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="Gabriel Ong">
  <link rel="stylesheet" href="{{ root_path }}/style.css">
  {% if has_mermaid %}<script src="{{ root_path }}/mermaid.js" defer></script>{% endif %}
  {% if toc_enabled %}<script src="{{ root_path }}/toc.js" defer></script>{% endif %}
  {% if has_math %}
  <script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']]}};</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
  <script src="{{ root_path }}/site.js" defer></script>
  <title>{{ page_title }}</title>
  <link rel="icon" href="{{ root_path }}/asset/favicon.svg" type="image/svg+xml">
</head>
<body{% if toc_enabled %} data-toc-enabled="true"{% endif %}>
  <div class="site-shell">
    <header class="site-header">
      <nav aria-label="Primary">
        <a href="{{ root_path }}/">Home</a>
        <a href="{{ root_path }}/blog/">Writing</a>
        <a href="{{ root_path }}/personal-wiki/">Wiki</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>© 2023–<span id="current-year"></span> Gabriel Ong.</p>
    </footer>
  </div>
</body>
</html>
