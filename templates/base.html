<!doctype html>
<html lang="en" data-font="editorial" data-palette="paper" data-theme="light" data-intro="writeup" data-corners="soft" data-accent="moss" data-motion="true" data-sticky="false" data-highlights="true" data-emojis="true" data-logos="true" data-navigation="dan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ meta_description }}">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#faf9f6">
  <meta name="author" content="Gabriel Ong">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="sitemap" type="application/xml" href="{{ root_site_url }}sitemap.xml">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="Gabriel Ong">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ default_image_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ default_image_url }}">
  <meta name="twitter:creator" content="@gongahkia">
  {% block structured_data %}{% endblock %}
  <title>{{ page_title }}</title>
  <link rel="icon" href="{{ root_path }}/asset/favicon.svg?v=11-light" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root_path }}/content.css">
  <link rel="stylesheet" href="{{ root_path }}/style.css">
  <link rel="stylesheet" href="{{ root_path }}/tiempos.css">
  <script src="{{ root_path }}/site.js"></script>
  {% if has_mermaid %}<script src="{{ root_path }}/mermaid.js" defer></script>{% endif %}
  {% if has_math %}
  <script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']]}};</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
</head>
<body{% if eden_page %} class="eden-page"{% endif %}{% if toc_enabled %} data-heading-anchors="true"{% endif %} data-root="{{ root_path }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-nav">
    <div class="nav-shell">
    <a class="wordmark" href="{{ root_path }}/" aria-label="Gabriel Ong, Engineer — home">Gabriel Ong, Engineer</a>
    <nav aria-label="Primary">
      <a href="{{ root_path }}/work/">Work<span class="nav-current" aria-hidden="true">*</span></a>
      <a href="{{ root_path }}/blog/">Writing<span class="nav-current" aria-hidden="true">*</span></a>
      <a href="{{ root_path }}/personal-wiki/">Wiki<span class="nav-current" aria-hidden="true">*</span></a>
    </nav>
    </div>
  </header>
  <main id="main" class="page-shell" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="page-footer">
    <p>© 2023–<span id="current-year">2026</span> Gabriel Ong.</p>
  </footer>
</body>
</html>
