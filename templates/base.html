<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="{{ meta_description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff" id="theme-color">
  <meta name="author" content="Gabriel Ong">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="Gabriel Ong">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ default_image_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ default_image_url }}">
  <meta name="twitter:creator" content="@gongahkia">
  {% block structured_data %}{% endblock %}
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="{{ root_path }}/style.css">
  {% if has_mermaid %}<script src="{{ root_path }}/mermaid.js" defer></script>{% endif %}
  {% if toc_enabled %}<script src="{{ root_path }}/toc.js" defer></script>{% endif %}
  {% if has_math %}
  <script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']]}};</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
  <script src="{{ root_path }}/site.js" defer></script>
  <title>{{ page_title }}</title>
  <link rel="icon" href="{{ root_path }}/asset/favicon.svg" type="image/svg+xml">
</head>
<body{% if toc_enabled %} data-toc-enabled="true"{% endif %}>
  <div id="click-container" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="site-header">
      <nav aria-label="Primary">
        <a href="{{ root_path }}/">Home</a>
        <a href="{{ root_path }}/blog/">Writing</a>
        <a href="{{ root_path }}/personal-wiki/">Wiki</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Toggle theme">
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <mask id="theme-toggle-mask">
              <rect x="0" y="0" width="24" height="24" fill="white"></rect>
              <circle class="theme-toggle-mask-cutout" cx="33" cy="0" r="9" fill="black"></circle>
            </mask>
            <circle class="theme-toggle-body" cx="12" cy="12" r="5" fill="currentColor" stroke="none" mask="url(#theme-toggle-mask)"></circle>
            <g class="theme-toggle-rays">
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="5.64" y1="5.64" x2="4.22" y2="4.22"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              <line x1="5.64" y1="18.36" x2="4.22" y2="19.78"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            </g>
          </svg>
        </button>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>© 2023–<span id="current-year"></span> Gabriel Ong.</p>
    </footer>
  </div>
</body>
</html>
