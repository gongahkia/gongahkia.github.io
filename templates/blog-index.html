{% extends "base.html" %}
{% set eden_page = true %}
{% block structured_data %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": {{ (canonical_url ~ "#collection")|tojson }},
    "url": {{ canonical_url|tojson }},
    "name": "Gabriel's Blog",
    "description": {{ meta_description|tojson }},
    "isPartOf": {
      "@type": "WebSite",
      "@id": {{ (root_site_url ~ "#website")|tojson }},
      "url": {{ root_site_url|tojson }},
      "name": "Gabriel Ong"
    },
    "author": {"@type": "Person", "@id": {{ person_id|tojson }}, "name": "Gabriel Ong", "url": {{ root_site_url|tojson }}}
  }
  </script>
{% endblock %}
{% block content %}
<article class="eden-content">
  <h1>Writing</h1>
  <ul class="eden-list">
    {% for post in posts %}
    <li><a href="posts/{{ post.filename }}"><span class="eden-list-title">{{ post.title }}</span><time class="eden-meta" datetime="{{ post.date|iso_date }}">{{ post.date|display_date }}</time></a></li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
