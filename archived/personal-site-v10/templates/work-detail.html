{% extends "base.html" %}
{% block structured_data %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "@id": {{ (canonical_url ~ "#software")|tojson }},
    "mainEntityOfPage": {"@type": "WebPage", "@id": {{ canonical_url|tojson }}},
    "url": {{ canonical_url|tojson }},
    "name": {{ title|tojson }},
    "headline": {{ title|tojson }},
    "description": {{ meta_description|tojson }},
    "datePublished": {{ date_published|tojson }},
    "dateModified": {{ date_modified|tojson }},
    {% if repository %}"codeRepository": {{ repository|tojson }},{% endif %}
    "author": {"@type": "Person", "@id": {{ person_id|tojson }}, "name": "Gabriel Ong", "url": {{ root_site_url|tojson }}}
  }
  </script>
{% endblock %}
{% block content %}
<article class="detail-page">
  <section class="writeup-details">
    <h1 data-toc>{{ title }}</h1>
    <dl>
      <dt>Date</dt><dd>{{ date }}</dd>
      <dt>Summary</dt><dd>{{ summary }}</dd>
      {% if repository %}<dt>Repository</dt><dd><a href="{{ repository }}">{{ repository }}</a></dd>{% endif %}
    </dl>
  </section>
  <section class="writeup-content prose">{{ content }}</section>
</article>
{% endblock %}
